<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week Project — Settimana III</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <header>
        <!-- Titolo dell'app + sottotitolo + button tema chiaro/scuro -->
        <div>
            <h1>La mia Vinylshelf</h1>
            <p>Aggiungi i vinili che hai o che vorresti acquistare</p>
        </div>
        <button id="dark">Tema scuro</button>

    </header>

    <main class="container">

        <section class="form">
            <!-- Form di inserimento di nuovi elementi -->
            <h2>Aggiungi un vinile</h2>
            <form id="viniliForm">
                <input type="text" id="titolo" placeholder="Album">
                <input type="text" id="autore" placeholder="Artista">
                <input type="number" id="anno" placeholder="Anno">
                <select id="stato">
                    <option>Da acquistare</option>
                    <option>Acquistato</option>
                </select>

                <button type="submit" id="addButton">Aggiungi</button>
            </form>
        </section>

        <section class="controlli">
            <!-- Ricerca live, filtro (select), ordinamento -->
            <input type="text" id="search" placeholder="Cerca album o artista">
            <select id="filter">
                <option value="Tutti">Tutti</option>
                <option value="Acquistato">Acquistati</option>
                <option value="Da acquistare">Da acquistare</option>
            </select>
            <select id="sort">
                <option value="titolo">Titolo A-Z</option>
                <option value="anno">Anno crescente</option>
            </select>
        </section>

        <section class="statistiche">
            <!-- Conteggi e/o barre orizzontali -->
             <div class="statBox">
                <div class="numero" id="totale">0</div>
                <p>Totale</p>
             </div>

             <div>
                <div class="numero" id="acquistati">0</div>
                <p>Acquistati</p>
             </div>

             <div>
                <div class="numero" id="daAcquistare">0</div>
                <p>Da acquistare</p>
             </div>

             <div>
                <p>PERCENTUALE ACQUISTATI</p>
                <div class="barra">
                    <div class="riempimento" id="barraPercentuale"></div>
                </div>
             </div>
        </section>

        <section class="lista">
            <!-- Container che render() ricostruisce a ogni cambio di stato -->
        </section>

        <div id="notifica"></div>

    </main>

    <footer>
        <!-- Autore, anno -->
    </footer>

    <script src="assets/js/script.js"></script>
</body>

</html>
